[project]
name = "scripter"
version = "0.1.0"
description = "Generate synchronized typing videos from speech audio."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "faster-whisper>=1.2,<2",
    "pillow>=11,<13",
    "python-dotenv>=1.0,<2",
    # PyAV 19 removed metadata_errors, which faster-whisper 1.2 uses.
    "av>=11,<19",
    "mlx-whisper>=0.4,<1 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "modal>=1.6.2",
]

[tool.uv]
package = false
